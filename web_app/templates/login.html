<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACPRED - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            background-image: radial-gradient(at 0% 0%, #1a2a47 0px, transparent 40%),
                              radial-gradient(at 100% 100%, #301747 0px, transparent 40%);
            background-size: 100% 100%;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .glass-panel {
            background-color: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.5);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border-radius: 16px;
        }
    </style>
</head>
<body>
    <div class="glass-panel p-10 w-full max-w-md space-y-6">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-blue-400 tracking-tight">STACPRED</h1>
            <p class="text-gray-400">Secure Console Access</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="bg-red-800 p-3 rounded text-white text-sm text-center">
            {% for message in messages %}
            {{ message }}
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-6">
            
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300">Username</label>
                <input type="text" id="username" name="username" required
                       class="mt-1 w-full p-3 border border-gray-700 rounded-lg bg-gray-900 text-white focus:ring-blue-500 focus:border-blue-500"
                       placeholder="Enter username">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 w-full p-3 border border-gray-700 rounded-lg bg-gray-900 text-white focus:ring-blue-500 focus:border-blue-500"
                       placeholder="Enter password">
            </div>

            <button type="submit"
                    class="w-full px-6 py-3 border border-transparent text-lg font-bold rounded-xl shadow-lg text-white bg-blue-600 hover:bg-blue-500 transition-all duration-300"
            >
                Log In
            </button>
        </form>
    </div>
</body>
</html>
